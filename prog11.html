<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Pencil Sketch Studio</title>

<style>
* { box-sizing: border-box; }

body {
  margin: 0;
  font-family: Arial, sans-serif;
  background: #f1eee8;
  color: #292522;
  text-align: center;
}

header {
  background: #292522;
  color: white;
  padding: 22px 10px;
}

header h1 { margin: 0 0 10px; }
header p { margin: 0; }

main {
  max-width: 1100px;
  margin: 20px auto;
  padding: 12px;
}

.panels {
  display: grid;
  grid-template-columns: repeat(2, minmax(0, 1fr));
  gap: 18px;
}

.panel {
  background: white;
  border-radius: 12px;
  padding: 15px;
  box-shadow: 0 3px 12px #00000012;
}

canvas {
  width: 100%;
  height: auto;
  background: #fff;
  border: 1px solid #ddd;
  border-radius: 5px;
}

.controls {
  margin-top: 20px;
  padding: 18px;
  background: white;
  border-radius: 12px;
}

.buttons {
  display: flex;
  flex-wrap: wrap;
  justify-content: center;
  gap: 10px;
  margin: 16px 0;
}

button, .upload {
  padding: 11px 15px;
  background: #925a55;
  color: white;
  border: none;
  border-radius: 7px;
  cursor: pointer;
  font-size: 14px;
}

button:hover, .upload:hover { background: #71423e; }

.control {
  text-align: left;
  margin: 17px 0;
}

.control label {
  display: flex;
  justify-content: space-between;
  margin-bottom: 8px;
}

input[type="range"] { width: 100%; }

#status { color: #65514d; }

@media (max-width: 650px) {
  .panels { grid-template-columns: 1fr; }
}
</style>
</head>

<body>

<header>
  <h1>✏️ Pencil Sketch Studio</h1>
  <p>Turn your photos into pencil drawings</p>
</header>

<main>
  <div class="panels">
    <section class="panel">
      <h3>Original Image</h3>
      <canvas id="original" width="640" height="480"></canvas>
    </section>

    <section class="panel">
      <h3>Pencil Sketch</h3>
      <canvas id="result" width="640" height="480"></canvas>
    </section>
  </div>

  <div class="buttons">
    <label class="upload">
      Upload Picture
      <input id="file" type="file" accept="image/*" hidden>
    </label>
    <button id="start">Start Webcam</button>
    <button id="stop">Stop Webcam</button>
    <button id="download">Download Sketch</button>
  </div>

  <video id="video" autoplay playsinline muted hidden></video>

  <div class="controls">
    <h3>Sketch Settings</h3>

    <div class="control">
      <label>Shading Strength <span id="shadeValue">65%</span></label>
      <input id="shade" type="range" min="10" max="100" value="65">
    </div>

    <div class="control">
      <label>Hair & Shadow Darkness <span id="darkValue">70%</span></label>
      <input id="dark" type="range" min="10" max="100" value="70">
    </div>

    <div class="control">
      <label>Outline Detail <span id="detailValue">65%</span></label>
      <input id="detail" type="range" min="10" max="100" value="65">
    </div>

    <div class="control">
      <label>Pencil Texture <span id="textureValue">35%</span></label>
      <input id="texture" type="range" min="0" max="100" value="35">
    </div>

    <p id="status">Upload a photo or start the webcam.</p>
  </div>
</main>

<script>
const W = 640, H = 480;

const original = document.getElementById("original");
const result = document.getElementById("result");
const octx = original.getContext("2d");
const rctx = result.getContext("2d");
const video = document.getElementById("video");

const grayCanvas = document.createElement("canvas");
grayCanvas.width = W;
grayCanvas.height = H;
const gctx = grayCanvas.getContext("2d");

const blurCanvas = document.createElement("canvas");
blurCanvas.width = W;
blurCanvas.height = H;
const bctx = blurCanvas.getContext("2d");

let cameraStream = null;
let cameraActive = false;
let animationId = null;
let sourceLoaded = false;

function drawFit(ctx, image) {
  ctx.fillStyle = "#ffffff";
  ctx.fillRect(0, 0, W, H);

  const iw = image.videoWidth || image.naturalWidth || image.width;
  const ih = image.videoHeight || image.naturalHeight || image.height;

  if (!iw || !ih) return;

  const scale = Math.min(W / iw, H / ih);
  const dw = iw * scale;
  const dh = ih * scale;

  ctx.drawImage(
    image,
    (W - dw) / 2,
    (H - dh) / 2,
    dw,
    dh
  );
}

function makeSketch() {
  const shade = Number(document.getElementById("shade").value) / 100;
  const darkness = Number(document.getElementById("dark").value) / 100;
  const detail = Number(document.getElementById("detail").value) / 100;
  const texture = Number(document.getElementById("texture").value) / 100;

  // Convert the original photo into grayscale.
  const originalData = octx.getImageData(0, 0, W, H);
  const grayData = gctx.createImageData(W, H);
  const pixels = originalData.data;
  const grayPixels = grayData.data;

  for (let i = 0; i < pixels.length; i += 4) {
    const gray =
      0.299 * pixels[i] +
      0.587 * pixels[i + 1] +
      0.114 * pixels[i + 2];

    grayPixels[i] = gray;
    grayPixels[i + 1] = gray;
    grayPixels[i + 2] = gray;
    grayPixels[i + 3] = 255;
  }

  gctx.putImageData(grayData, 0, 0);

  // Blur the grayscale image for the pencil-shading effect.
  bctx.clearRect(0, 0, W, H);
  bctx.filter = blur(${1.5 + detail * 3}px);
  bctx.drawImage(grayCanvas, 0, 0);
  bctx.filter = "none";

  const blurredData = bctx.getImageData(0, 0, W, H);
  const output = rctx.createImageData(W, H);
  const out = output.data;
  const blur = blurredData.data;

  // Pencil shading: divide original gray by blurred gray.
  for (let y = 1; y < H - 1; y++) {
    for (let x = 1; x < W - 1; x++) {
      const i = (y * W + x) * 4;
      const gray = grayPixels[i];
      const blurGray = Math.max(1, blur[i]);

      let pencil = Math.min(255, gray * 255 / blurGray);

      // Detect edges to create visible pencil outlines.
      const left = grayPixels[i - 4];
      const right = grayPixels[i + 4];
      const up = grayPixels[i - W * 4];
      const down = grayPixels[i + W * 4];

      const edge = Math.min(
        1,
        (Math.abs(left - right) +
         Math.abs(up - down)) / 100
      );

      // Make outlines stronger without turning the whole photo black.
      pencil -= edge * detail * 115;

      // Keep highlights light and deepen hair/shadow areas.
      const shadow = Math.max(0, (150 - gray) / 150);
      pencil -= shadow * darkness * 48;

      // Blend original grayscale with pencil rendering.
      let finalGray = gray * (1 - shade) + pencil * shade;

      // Add gentle paper-like pencil grain.
      const noise =
        (Math.random() - 0.5) * texture * 20;

      finalGray = Math.max(
        0,
        Math.min(255, finalGray + noise)
      );

      out[i] = finalGray;
      out[i + 1] = finalGray;
      out[i + 2] = finalGray;
      out[i + 3] = 255;
    }
  }

  // Fill the outermost pixels from the grayscale image.
  for (let x = 0; x < W; x++) {
    for (const y of [0, H - 1]) {
      const i = (y * W + x) * 4;
      out[i] = out[i + 1] = out[i + 2] = grayPixels[i];
      out[i + 3] = 255;
    }
  }

  for (let y = 0; y < H; y++) {
    for (const x of [0, W - 1]) {
      const i = (y * W + x) * 4;
      out[i] = out[i + 1] = out[i + 2] = grayPixels[i];
      out[i + 3] = 255;
    }
  }

  rctx.putImageData(output, 0, 0);
  document.getElementById("status").textContent =
    "Pencil sketch created successfully!";
}

document.getElementById("file").addEventListener("change", event => {
  const file = event.target.files[0];
  if (!file) return;

  stopCamera();

  const image = new Image();

  image.onload = () => {
    drawFit(octx, image);
    sourceLoaded = true;
    makeSketch();
    URL.revokeObjectURL(image.src);
  };

  image.onerror = () => {
    document.getElementById("status").textContent =
      "Unable to open this image. Please try another photo.";
  };

  image.src = URL.createObjectURL(file);
});

async function startCamera() {
  try {
    stopCamera();

    cameraStream = await navigator.mediaDevices.getUserMedia({
      video: { facingMode: "user" },
      audio: false
    });

    video.srcObject = cameraStream;
    await video.play();

    cameraActive = true;
    sourceLoaded = true;
    drawLive();

    document.getElementById("status").textContent =
      "Webcam is running.";
  } catch (error) {
    document.getElementById("status").textContent =
      "Camera unavailable. Allow camera permission or open this page on localhost/HTTPS.";
  }
}

function drawLive() {
  if (!cameraActive) return;

  drawFit(octx, video);
  makeSketch();

  animationId = requestAnimationFrame(drawLive);
}

function stopCamera() {
  cameraActive = false;

  if (animationId) {
    cancelAnimationFrame(animationId);
    animationId = null;
  }

  if (cameraStream) {
    cameraStream.getTracks().forEach(track => track.stop());
    cameraStream = null;
  }

  video.srcObject = null;
}

document.getElementById("start").addEventListener("click", startCamera);
document.getElementById("stop").addEventListener("click", stopCamera);

document.getElementById("download").addEventListener("click", () => {
  if (!sourceLoaded) {
    document.getElementById("status").textContent =
      "Upload a photo or start the webcam first.";
    return;
  }

  const link = document.createElement("a");
  link.download = "pencil-sketch.png";
  link.href = result.toDataURL("image/png");
  link.click();
});

["shade", "dark", "detail", "texture"].forEach(id => {
  document.getElementById(id).addEventListener("input", event => {
    document.getElementById(
      id === "shade" ? "shadeValue" :
      id === "dark" ? "darkValue" :
      id === "detail" ? "detailValue" : "textureValue"
    ).textContent = event.target.value + "%";

    if (sourceLoaded && !cameraActive) makeSketch();
  });
});
</script>

</body>
</html>
